name: Build Windows & macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # để tạo GitHub Release khi push tag v*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TongHopKhaoSat-Windows
            file: dist/TongHopKhaoSat-Windows.exe
          - os: macos-latest          # Apple Silicon (M1/M2/M3/M4)
            artifact: TongHopKhaoSat-macOS-AppleSilicon
            file: dist/TongHopKhaoSat-macOS-AppleSilicon.zip
          - os: macos-15-intel        # Mac chip Intel
            artifact: TongHopKhaoSat-macOS-Intel
            file: dist/TongHopKhaoSat-macOS-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pyinstaller TongHopKhaoSat.spec --clean --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/TongHopKhaoSat.exe "${{ matrix.file }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/TongHopKhaoSat.app
          ditto -c -k --sequesterRsrc --keepParent dist/TongHopKhaoSat.app "${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

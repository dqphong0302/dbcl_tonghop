[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbcl-tonghop"
version = "2.0.0"
description = "Phần mềm tự động hóa tổng hợp báo cáo kết quả khảo sát ĐBCL và phân loại ý kiến sinh viên (Excel → Word)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Đặng Quốc Phong", email = "dqphong0302@gmail.com" }
]
keywords = [
    "education",
    "survey",
    "excel",
    "word",
    "report-generator",
    "quality-assurance",
    "nlp-offline",
    "tkinter"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
dbcl-gui = "gui_app:main"
dbcl-report = "excel_to_word:main"
dbcl-feedback = "merge_feedbacks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
